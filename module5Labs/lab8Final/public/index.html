<!doctype html>
<html lang="en">
  <template id="card-template">
    <div class="col-lg-3 col-md-6 col-sm-12 mb-4">
      <div class="card h-100">
        <div class="card-header"></div>
        <img
          src="..."
          class="card-img-top p-3"
          alt="..."
          style="height: 200px; object-fit: contain"
        />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title"></h5>
          <h6 class="card-subtitle mb-2 text-body-secondary"></h6>
          <p class="card-text flex-grow-1"></p>
          <a href="#" class="btn btn-primary mt-auto">Read More</a>
        </div>
      </div>
    </div>
  </template>

  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake eCommerce Store</title>
  </head>

  <body>
    <div class="container p-3">
      <h2 class="mb-3">Fake eCommerce Store</h2>
      <div class="filters d-flex flex-wrap gap-3 align-items-center mb-4">
        <select
          name="category_filter"
          id="category_filter"
          class="form-select w-auto"
          onchange="filterProducts(event)"
        >
          <option>All Products</option>
        </select>

        <div id="sort">
          <label class="d-flex align-items-center gap-2">
            Sort By:
            <select
              name="sort_order"
              id="sort_order"
              class="form-select w-auto"
              onchange="sortProducts(event)"
            >
              <option value="id">Default ordering</option>
              <option value="price_lohi">Price (low to high)</option>
              <option value="price_hilo">Price (high to low)</option>
              <option value="title_az">Title (A to Z)</option>
              <option value="title_za">Title (Z to A)</option>
            </select>
          </label>
        </div>

        <div id="search" class="d-flex gap-2">
          <input
            class="form-control"
            name="searchText"
            id="searchText"
            placeholder="Search products..."
          />
          <button class="btn btn-outline-primary" onclick="searchProducts()">
            Search
          </button>
        </div>
      </div>

      <div id="product-list" class="row"></div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./js/dataFetch.js"></script>
  </body>
</html>
