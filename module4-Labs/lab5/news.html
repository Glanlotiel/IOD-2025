<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <template id="news-template">
      <div class="card col-8" style="width: 18rem; margin: 10px">
        <div class="card-body">
          <h5 class="card-title">News title</h5>
          <p class="card-text">News text.</p>
        </div>
      </div>
    </template>

    <div class="container bg-light">
      <div>
        <h5>Keep Up To Date</h5>
      </div>
      <!-- News Container! -->
      <div id="news-list" class="row"></div>
    </div>

    <h2>Submit News</h2>
    <div class="mb-3" style="max-width: 400px">
      <input
        id="title-input"
        type="text"
        class="form-control mb-2"
        placeholder="Title"
      />
      <textarea
        id="content-input"
        class="form-control mb-2"
        placeholder="Content"
      ></textarea>
      <button id="submit-btn" class="btn btn-primary me-2">Submit</button>
      <button id="stop-btn" class="btn btn-danger">Stop Feed</button>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="newsData.js"></script>
  </body>
</html>
