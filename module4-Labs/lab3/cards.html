<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #e3f2fd;
      }
      .card {
        padding: 10px;
      }
      .card-title {
        font-weight: 600;
        font-size: 3em;
        padding: 0 0 10px 0;
      }
      .card-description {
        font-weight: 400;
        font-size: 2em;
      }
    </style>
  </head>
  <body>
    <template id="card-template">
      <div class="card">
        <div class="card-body">
          <div class="card-title"></div>
          <div class="card-text"></div>
          <img class="card-image" />
        </div>
      </div>
    </template>

    <div id="card-list"></div>
    <script>
      const data = [
        { name: "bob", age: 23 },
        { name: "alice", age: 39 },
      ];
      // For Exercise 3 use the following:
      const artist = {
        name: "Van Gogh",
        portfolio: [
          {
            title: "portrait",
            url: "https://collectionapi.metmuseum.org/api/collection/v1/iiif/436532/1671316/main-image",
          },
          {
            title: "sky",
            url: "https://mymodernmet.com/wp/wpcontent/uploads/2020/11/White-house-night-van-goh-worldwide2.jpg",
          },
        ],
      };

      function addCard(title, text, image) {
        // clone the template
        const template = document
          .getElementById("card-template")
          .content.cloneNode(true);
        // populate the template
        template.querySelector(".card-title").innerText = title;
        template.querySelector(".card-text").innerText = text;
        if (image) {
          template.querySelector(".card-image").src = image;
        }
        // include the populated template into the page
        document.querySelector("#card-list").appendChild(template);
      }
      data.forEach(({ name, age }) => {
        addCard(name, age);
      });

      artist.portfolio.forEach(({ title, url }) => {
        addCard(artist.name, title, url);
      });
    </script>
  </body>
</html>
