<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Placeholder Posts</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <template id="placeholder-template">
      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">News title</h5>
            <p class="card-text">News text.</p>
          </div>
        </div>
      </div>
    </template>

    <nav class="navbar navbar-expand-lg bg-light m-2 p-3">Bootstrap Cards</nav>
    <div
      id="placeholder-list"
      class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3 m-5"
    ></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      const limit = 10;

      fetch(`https://jsonplaceholder.typicode.com/posts?_limit=${limit}`)
        .then((response) => response.json()) // parse the JSON from the response
        .then((posts) => {
          posts.forEach((post) => addCard(post)); // call addCard for each post
        });

      function addCard(post) {
        const template = document
          .getElementById("placeholder-template")
          .content.cloneNode(true);
        template.querySelector(".card-title").innerText = post.title;
        template.querySelector(".card-text").innerText = post.body;
        document.querySelector("#placeholder-list").appendChild(template);
      }
    </script>
  </body>
</html>
